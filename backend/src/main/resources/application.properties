spring.application.name=MacroBridge

# Load secrets from the repo-root .env (run from backend/) or a local one
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database (Supabase Postgres, session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Health check at /actuator/health, including database status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
