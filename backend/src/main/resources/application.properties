spring.application.name=MacroBridge
# Cloud Run tells the app which port to listen on
server.port=${PORT:8080}

# Load secrets from the repo-root .env (run from backend/) or a local one
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database (Supabase Postgres, session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Health check at /actuator/health, including database status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Auth
jwt.secret=${JWT_SECRET}
# 90 days: people use this as a phone app and shouldn't have to log in every week
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:2160}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Gemini (meal analysis). Key from https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
# flash-lite: the free tier allows ~500 requests/day for it vs ~20 for gemini-3.5-flash
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# AI calls (analyze + meal ideas) per user per day; everyone shares one Gemini quota
ai.daily-limit=${AI_DAILY_LIMIT:50}
