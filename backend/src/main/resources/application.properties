spring.application.name=MacroBridge

# Load secrets from the repo-root .env (run from backend/) or a local one
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database (Supabase Postgres, session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Health check at /actuator/health, including database status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Auth
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Gemini (meal analysis). Key from https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
