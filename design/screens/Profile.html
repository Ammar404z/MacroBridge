<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">
<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px 20px 8px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; height: 44px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Profile</h1>
</header>

<section style="margin-top: 10px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Display name</span>
<input type="text" value="Ammar" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; font-weight: 500">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Timezone</span>
<select style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; font-weight: 500; color-scheme: dark">
<option>Europe/Berlin</option>
</select>
<span style="font-size: 12px; color: #A3ACB3">Decides when your day resets.</span>
</label>
</section>

<section style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">Daily targets</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Calories (kcal)</span>
<input type="number" value="2400" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Protein (g)</span>
<input type="number" value="180" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Carbs (g)</span>
<input type="number" value="260" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Fat (g)</span>
<input type="number" value="70" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
</div>
<div style="font-size: 12px; color: #A3ACB3; font-variant-numeric: tabular-nums">Your macros add up to 2,390 kcal.</div>
</section>

<label style="margin-top: 12px; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; background: #171C1F; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 14px; font-weight: 600">Friends can see my meals</span>
<input type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #C8F25C; color-scheme: dark">
</label>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<button type="button" style="height: 52px; border: 0; border-radius: 26px; background: #C8F25C; color: #10140A; font-family: inherit; font-size: 16px; font-weight: 700">Save changes</button>
<a href="Login.html" style="height: 44px; color: #C9D0D4; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Log out</a>
</div>

</main>
<nav aria-label="Main" style="box-sizing: border-box; height: 84px; padding: 8px 8px 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border-top: 1px solid #22282C; background: #0F1214">
<a href="Today.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3ACB3; text-decoration: none; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span>Today</span>
</a>
<a href="Foods.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3ACB3; text-decoration: none; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
<span>Foods</span>
</a>
<a href="LogMeal.html" aria-label="Log a meal" style="justify-self: center; width: 52px; height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
<a href="Friends.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3ACB3; text-decoration: none; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"></circle><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"></path><circle cx="17" cy="9.5" r="2.5"></circle><path d="M16.5 14.5c2.2.2 3.6 1.6 4 4"></path></svg>
<span>Friends</span>
</a>
<a href="Profile.html" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #C8F25C; text-decoration: none; font-size: 11px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>
<span>Profile</span>
</a>
</nav>
</div>
</body>
</html>
