<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Log in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 24px 24px; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">

<section style="margin-top: 132px; display: flex; flex-direction: column; align-items: flex-start; gap: 20px">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="MacroBridge">
<rect width="64" height="64" rx="18" fill="#171C1F"></rect>
<circle cx="32" cy="32" r="17" stroke="#2A3136" stroke-width="7"></circle>
<circle cx="32" cy="32" r="17" stroke="#C8F25C" stroke-width="7" stroke-linecap="round" stroke-dasharray="74.77 106.81" transform="rotate(-90 32 32)"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em">MacroBridge</h1>
<div style="font-size: 15px; line-height: 1.45; color: #A3ACB3">Describe a meal or snap a photo.<br>Your macros are logged against today's targets.</div>
</div>
</section>

<section style="margin-top: 40px; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Email</span>
<input type="email" placeholder="you@example.com" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Password</span>
<input type="password" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px">
</label>
<a href="Today.html" style="margin-top: 10px; height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Log in</a>
</section>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; font-size: 14px; color: #A3ACB3">
<span>New here?</span>
<button type="button" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #C8F25C; font-family: inherit; font-size: 14px; font-weight: 700">Create an account</button>
</div>

</div>
</body>
</html>
