<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Check the estimate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 16px; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; height: 44px; margin-left: -12px">
<a href="LogMeal.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F5F3; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Check the estimate</h1>
</header>

<section style="margin-top: 12px; padding: 14px; border-radius: 14px; background: #171C1F; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px">
<div>Chicken breast, grilled <span style="color: #A3ACB3">(150 g)</span></div>
<div style="color: #C9D0D4; font-variant-numeric: tabular-nums">250 kcal</div>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px">
<div>White rice, cooked <span style="color: #A3ACB3">(200 g)</span></div>
<div style="color: #C9D0D4; font-variant-numeric: tabular-nums">260 kcal</div>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px">
<div>Avocado <span style="color: #A3ACB3">(half, medium)</span></div>
<div style="color: #C9D0D4; font-variant-numeric: tabular-nums">120 kcal</div>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px">
<div>Soy-sesame dressing <span style="color: #A3ACB3">(1 tbsp)</span></div>
<div style="color: #C9D0D4; font-variant-numeric: tabular-nums">50 kcal</div>
</div>
<div style="margin-top: 2px; padding-top: 10px; border-top: 1px solid #2A3136; font-size: 12px; line-height: 1.45; color: #A3ACB3"><span style="font-weight: 700; color: #F2F5F3">Medium confidence.</span> Portions are estimated from the photo. The rice amount is the least certain.</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Description</span>
<input type="text" value="Chicken rice bowl with avocado" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; font-weight: 500">
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; color: #C9D0D4">Meal</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Breakfast</button>
<button type="button" aria-pressed="true" style="height: 44px; border: 1px solid #C8F25C; border-radius: 12px; background: #C8F25C; color: #10140A; font-family: inherit; font-size: 13px; font-weight: 700">Lunch</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Dinner</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Snack</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Calories (kcal)</span>
<input type="number" value="680" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Protein (g)</span>
<input type="number" value="48" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Carbs (g)</span>
<input type="number" value="70" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Fat (g)</span>
<input type="number" value="22" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
</div>

<label style="height: 48px; display: flex; align-items: center; gap: 12px">
<input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #C8F25C; color-scheme: dark">
<span style="font-size: 14px; font-weight: 600">Also save to my foods</span>
</label>
</section>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<a href="Today.html" style="height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save meal</a>
<a href="LogMeal.html" style="height: 44px; color: #C9D0D4; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Start over</a>
</div>

</div>
</body>
</html>
