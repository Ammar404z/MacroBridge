<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Edit food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 16px; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; height: 44px; margin-left: -12px">
<a href="Foods.html" aria-label="Back to My foods" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F5F3; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Edit food</h1>
</header>

<section style="margin-top: 16px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Name</span>
<input type="text" value="Protein shake" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; font-weight: 500">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Serving (optional)</span>
<input type="text" value="1 shake" placeholder="e.g. 1 bowl, 100 g" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; font-weight: 500">
</label>
</section>

<section style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">Macros per serving</h2>
<div style="font-size: 12px; color: #A3ACB3">Logging 2 servings doubles these.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Calories (kcal)</span>
<input type="number" value="270" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Protein (g)</span>
<input type="number" value="34" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Carbs (g)</span>
<input type="number" value="16" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">Fat (g)</span>
<input type="number" value="8" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 17px; font-weight: 700">
</label>
</div>
</section>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<a href="Foods.html" style="height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save food</a>
<button type="button" style="height: 44px; border: 0; background: transparent; color: #FF8A7A; font-family: inherit; font-size: 14px; font-weight: 600">Delete food</button>
</div>

</div>
</body>
</html>
