<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Log a meal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; height: 44px; margin-left: -12px">
<a href="Today.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F5F3; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Log a meal</h1>
</header>

<section style="display: flex; flex-direction: column; gap: 16px; margin-top: 20px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #C9D0D4">What did you eat?</span>
<textarea rows="4" placeholder="e.g. 2 eggs, toast with butter, a latte" style="box-sizing: border-box; width: 100%; height: 124px; padding: 14px; border: 1px solid #2A3136; border-radius: 14px; background: #171C1F; color: #F2F5F3; font-family: inherit; font-size: 16px; line-height: 1.4; resize: none"></textarea>
</label>

<button type="button" style="height: 132px; border: 1px dashed #3A434A; border-radius: 14px; background: transparent; color: #F2F5F3; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8F25C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 15px; font-weight: 600">Take or choose a photo</span>
<span style="font-size: 12px; color: #A3ACB3">Text, a photo, or both</span>
</button>

<a href="Foods.html" style="height: 52px; box-sizing: border-box; padding: 0 10px 0 14px; border-radius: 14px; background: #171C1F; display: flex; align-items: center; gap: 10px; color: #F2F5F3; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3ACB3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
<span style="flex: 1; font-size: 14px; font-weight: 600">Pick from my foods</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3ACB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</section>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
<a href="LogResult.html" style="height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Analyze</a>
<button type="button" style="height: 44px; border: 0; background: transparent; color: #C9D0D4; font-family: inherit; font-size: 14px; font-weight: 600">Enter macros manually</button>
</div>

</div>
</body>
</html>
