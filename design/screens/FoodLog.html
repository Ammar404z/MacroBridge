<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroBridge, Log a food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F5F3}a:hover{color:#FFFFFF}
</style>
</head>
<body style="background: #0F1214">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 16px; display: flex; flex-direction: column; background: #0F1214; color: #F2F5F3; font-family: 'Manrope', 'Avenir Next', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; height: 44px; margin-left: -12px">
<a href="Foods.html" aria-label="Back to My foods" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F5F3; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Log a food</h1>
</header>

<section style="margin-top: 12px; padding: 16px 14px; border-radius: 14px; background: #171C1F; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Protein shake</div>
<div style="font-size: 13px; color: #A3ACB3; font-variant-numeric: tabular-nums">Per serving (1 shake): 270 kcal · P 34 · C 16 · F 8</div>
</section>

<section style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #C9D0D4">Servings</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Fewer servings" style="width: 64px; height: 64px; border: 1px solid #2A3136; border-radius: 32px; background: #171C1F; color: #F2F5F3; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<div style="font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">1.5</div>
<button type="button" aria-label="More servings" style="width: 64px; height: 64px; border: 1px solid #2A3136; border-radius: 32px; background: #171C1F; color: #F2F5F3; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</section>

<section style="margin-top: 24px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; color: #C9D0D4">Meal</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Breakfast</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Lunch</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 1px solid #2A3136; border-radius: 12px; background: #171C1F; color: #C9D0D4; font-family: inherit; font-size: 13px; font-weight: 600">Dinner</button>
<button type="button" aria-pressed="true" style="height: 44px; border: 1px solid #C8F25C; border-radius: 12px; background: #C8F25C; color: #10140A; font-family: inherit; font-size: 13px; font-weight: 700">Snack</button>
</div>
</section>

<section style="margin-top: 24px; padding: 14px; border: 1px solid #2A3136; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 600; color: #A3ACB3">This adds</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 20px; line-height: 1; font-weight: 700; color: #C8F25C; font-variant-numeric: tabular-nums">405</div>
<div style="font-size: 12px; color: #A3ACB3">kcal</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 20px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums">51 g</div>
<div style="font-size: 12px; color: #A3ACB3">protein</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 20px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums">24 g</div>
<div style="font-size: 12px; color: #A3ACB3">carbs</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 20px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums">12 g</div>
<div style="font-size: 12px; color: #A3ACB3">fat</div>
</div>
</div>
<div style="padding-top: 10px; border-top: 1px solid #2A3136; font-size: 13px; color: #A3ACB3; font-variant-numeric: tabular-nums">Leaves you 705 kcal for today.</div>
</section>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<a href="Today.html" style="height: 52px; border-radius: 26px; background: #C8F25C; color: #10140A; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Log 1.5 servings</a>
<a href="FoodEdit.html" style="height: 44px; color: #C9D0D4; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Edit this food</a>
</div>

</div>
</body>
</html>
